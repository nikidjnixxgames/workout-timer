<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workout Timer</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111827;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center}main{width:min(100% - 40px,520px);text-align:center;padding:32px 24px}h1{font-size:32px;margin:0}.phase{font-size:22px;font-weight:800;letter-spacing:2px;margin-top:42px}.timer{font-size:76px;font-weight:800;margin-top:8px}.round{color:#cbd5e1;font-size:17px}.settings{display:flex;gap:10px;margin-top:42px}.setting{flex:1}.setting label{display:block;color:#94a3b8;font-size:12px;margin-bottom:6px}.setting input{width:100%;background:#1f2937;border:1px solid #374151;border-radius:10px;color:white;font-size:19px;padding:12px;text-align:center}.buttons{display:grid;gap:12px;margin-top:30px}button{border:0;border-radius:12px;color:white;font-size:18px;font-weight:700;padding:16px}.start{background:#16a34a}.pause{background:#334155}.reset{background:#7f1d1d}
</style></head><body><main><h1>Workout Timer</h1><div id="phase" class="phase">WORK</div><div id="timer" class="timer">00:30</div><div id="round" class="round">Round 1 of 8</div>
<div class="settings"><div class="setting"><label>Work (sec)</label><input id="work" type="number" min="1" value="30"></div><div class="setting"><label>Rest (sec)</label><input id="rest" type="number" min="1" value="15"></div><div class="setting"><label>Rounds</label><input id="rounds" type="number" min="1" value="8"></div></div>
<div class="buttons"><button class="start" id="start">Start</button><button class="pause" id="pause">Pause</button><button class="reset" id="reset">Reset</button></div></main>
<script>
let phase="WORK",round=1,left=30,running=false,end=0,id=null,audioCtx=null;
const $=x=>document.getElementById(x),num=(x,d)=>Math.max(1,parseInt($(x).value)||d);
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function draw(){ $("phase").textContent=phase; $("phase").style.color=phase==="WORK"?"#22c55e":"#f59e0b";$("timer").textContent=fmt(left);$("round").textContent="Round "+round+" of "+num("rounds",8)}
function unlockSound(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();}catch(e){audioCtx=null}}
function tone(frequency,delay=0,length=.18){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.type="sine";o.frequency.value=frequency;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+length);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+length+.03)}
function intervalSound(){unlockSound();tone(880,0,.18);tone(660,.2,.28);navigator.vibrate&&navigator.vibrate([0,180,100,180])}
function finishSound(){unlockSound();tone(523,0,.18);tone(659,.2,.18);tone(784,.4,.38);navigator.vibrate&&navigator.vibrate([0,200,100,200,100,300])}
function tick(){left=Math.max(0,Math.ceil((end-Date.now())/1000));draw();if(left)return;let w=num("work",30),r=num("rest",15),t=num("rounds",8);if(phase==="WORK"&&round<t){intervalSound();phase="REST";left=r;end=Date.now()+r*1000}else if(phase==="REST"&&round<t){intervalSound();round++;phase="WORK";left=w;end=Date.now()+w*1000}else{finishSound();running=false;clearInterval(id);$("phase").textContent="COMPLETE";$("round").textContent="Workout complete"}}
$("start").onclick=()=>{unlockSound();if(!running){if($("phase").textContent==="COMPLETE"){phase="WORK";round=1;left=num("work",30)}end=Date.now()+left*1000;running=true;id=setInterval(tick,200)}};
$("pause").onclick=()=>{if(running){tick();running=false;clearInterval(id)}};
$("reset").onclick=()=>{running=false;clearInterval(id);phase="WORK";round=1;left=num("work",30);draw()};
$("work").onchange=()=>{if(!running&&round===1&&phase==="WORK"){$("timer").textContent=fmt(num("work",30));left=num("work",30)}};
draw();
</script></body></html>
