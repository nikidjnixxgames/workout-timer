<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Timer</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111827; color: #fff; display: grid; place-items: center; }
    main { width: min(100% - 40px, 520px); text-align: center; padding: 32px 24px; }
    h1 { margin: 0; font-size: 42px; letter-spacing: -1px; }
    p { margin: 14px 0 0; color: #cbd5e1; font-size: 18px; }
    .badge { display: inline-block; margin-top: 28px; padding: 8px 14px; border: 1px solid #334155; border-radius: 999px; color: #94a3b8; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Workout Timer</h1>
    <p>Основната структура е подготвена.</p>
    <span class="badge">Expo · React Native · TypeScript</span>
  </main>
</body>
</html>
